      - '\bstaged (attack|incident|provocation)'
      - '\bpretext'
      - '\b(genocide|persecution|oppression|discrimination) of (russians|russian[- ]speak\w*)'
      - '\bprotect\w* (russian|compatriots)'
      - '\brussophob\w*'
      - '\b(poland|polish|warsaw|lithuania|latvia|estonia|baltic\w*)\b.{0,60}\b(militari[sz]ation|preparing (an )?attack|threat to (russia|belarus))'
      - '\bfałszyw\w* flag'
      - '\b(rosj\w*|rosyjsk\w*|kreml\w*|moskw\w*|ławrow\w*|zacharow\w*|pieskow\w*|putin\w*|mińsk\w*|białoru\w*|łukaszenk\w*)\b.{0,60}\bprowokacj\w*'
      - '\bpreteks\w*'
      - '\binscenizac\w*'
      - '\brusofob\w*'
      - 'провокац\w*'
      - 'русофоб\w*'
      - 'геноцид'
  retoryka:
    nazwa: "Retoryka i ultimata Kremla"
    waga: 2
    wysoka: true
    propaganda_jako_sygnal: true
    wzorce:
      - '\bultimatum'
      - '\bsecurity guarantees'
      - '\bnuclear\b.{0,30}\b(threat\w*|warn\w*|weapons?|strike|use|doctrine|drills?)'
