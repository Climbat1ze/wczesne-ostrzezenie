      - '\b(ordered|authori[sz]ed) departure'
      - '\b(leave|depart)\b.{0,25}\bimmediately'
      - '\bdo not travel\b'
      - '\blevel 4\b'
      - '\bexpel\w*\b.{0,30}\bdiplomats?'
      - '\bdiplomats?\b.{0,15}\bexpelled'
      - '\b(clos\w*)\b.{0,20}\b(embassy|consulate)'
      - '\bewakuac\w* (ambasad|placówk|dyplomat|personel|obywatel)'
      - '\b(opu[sś]ci\w*|wyjecha\w*|wyjazd\w*)\b.{0,30}\b(natychmiast|niezwłocznie)'
      - '\bwydal\w*\b.{0,30}\bdyplomat'
      - '\bzamkn\w*\b.{0,20}\b(ambasad|konsulat)'
      - 'эвакуац\w* (посольств|дипломат)'
      - 'высыл\w* дипломат'
  ostrzezenia_sojusznikow:
    nazwa: "Ostrzeżenia wywiadu i sojuszników"
    waga: 4
    wysoka: true
    wzorce:
      - '\b(intelligence|intel)\b.{0,20}\b(warn\w*|assess\w*|suggest\w*|indicat\w*)\b.{0,60}\b(attack\w*|invasion|invade|aggression|offensive|war)\b'
      - '\b(could|may|might|ready to|preparing to)\b.{0,10}\b(attack|invade|strike)\b'
      - '\bimminent (attack|invasion|threat|war)'
      - '\bdeclassif\w*'
      - '\bwarn\w*\b.{0,40}\b(attack|invasion|aggression|war)\b'
      - '\bwywiad\w*\b.{0,40}\b(ostrzeg\w*|oceni\w*|alarm\w*)\b.{0,60}\b(atak\w*|inwazj\w*|agresj\w*|ofensyw\w*|wojn\w*)'
      - '\b(zbliżając\w*|nieuchronn\w*|realn\w*) (atak|agresj|wojn|inwazj)'
      - '\bostrzeg\w*\b.{0,40}\b(atak|agresj|inwazj|wojn)'
      - '\b(przygotow\w*|szykuj\w*)\b.{0,15}\b(atak|agresj|inwazj|wojn)'
  pretekst:
    nazwa: "Budowanie pretekstu i oskarżenia"
    waga: 3
    wysoka: true
    propaganda_jako_sygnal: true
    wzorce:
