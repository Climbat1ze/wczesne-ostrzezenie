# Słownik wskaźników (metoda Indications & Warnings: lista zdarzeń, które poprzedzają atak).
# Wzorce to wyrażenia regularne, sprawdzane na małych literach tytułu i leadu (PL, EN, RU).
# waga: ile kategoria znaczy w indeksie. wysoka: liczy się do alarmu zbieżności.
# tylko_przeciwnik: wpis, w którym działa strona własna lub sojusznicza (Polska wysyła wojsko, urzędnicy się szkolą),
#   nie liczy się w tej kategorii; trafia do „przygotowań własnych” na pulpicie (app/intencja.py).
# propaganda_jako_sygnal: źródła w statusie „monitoring” (Kreml, MSZ Rosji, TASS) liczą się tu z pełną wagą,
#   bo w tej kategorii sygnałem jest samo to, co mówi Kreml.

kategorie:
  wojska_granica:
    nazwa: "Koncentracja wojsk przy granicy"
    waga: 3
    wysoka: true
    tylko_przeciwnik: true   # działania strony własnej nie liczą się (app/intencja.py, wersja 2.0)
    wzorce:
      - '\btroops?\b.{0,30}\b(build-?up|concentrat\w*|massing|amass\w*|moving|deploy\w*)'
      - '\b(massing|amassing|concentrat\w*) (of )?(troops|forces)'
      - '\b(troops|forces|units)\b.{0,25}\b(near|along|at|to) the (border|frontier)'
      - '\bsatellite (images?|imagery|photos?)\b'
      - '\biskander'
      - '\b(redeploy\w*|deploy\w*)\b.{0,30}\b(troops|forces|brigades?|divisions?|missiles?|nuclear)'
      - '\bkoncentracj\w* (wojsk|sił|oddział)'
      - '\bgromadz\w* (wojsk|sił|sprzęt)'
      - '\b(przerzut|przemieszcz|rozmieszcz)\w* (wojsk|sił|sprzętu|jednost|rakiet|broni)'
      - '\bzdjęci\w* satelitarn'
      - '\bwojsk\w* (przy|na|wzdłuż) granic'
      - 'стягива\w*'
      - 'переброск\w* (войск|техники)'
      - 'сосредоточени\w* войск'
    wykluczenia:
      # Własne i sojusznicze siły (Polska, UK, NATO, Europa, USA), gdy w tekście nie pada Rosja ani Białoruś jako strona.
      - '^(?!.*\b(russia\w*|russian|rosj\w*|rosyjsk\w*|belarus\w*|białoru\w*|kremlin|kreml\w*|россия|российск|белорус)).*\b(poland|polish|polsk\w*|polsc\w*|uk|british|brytyjsk\w*|european|europejsk\w*|nato|allied|sojusznicz\w*|german|niemieck\w*|american|amerykańsk\w*|lithuanian|litewsk\w*|latvian|łotewsk\w*|estonian|estońsk\w*)\b.{0,40}\b(troops|forces|soldiers|police|żołnierz\w*|wojsk\w*|sił\w*|policj\w*)'
      # Państwo flanki samo wysyła swoje siły (także „do granicy z Rosją”): to reakcja obronna, nie koncentracja przeciwnika.
      - '\b(poland|polska|lithuania|litwa|latvia|łotwa|estonia|finland|finlandia)\b.{0,15}\b(deploys?|deployed|sends?|sent|moves?|wysyła\w*|wysłała|kieruje\w*|przerzuca\w*)\b.{0,40}\b(troops|forces|soldiers|police|żołnierz\w*|wojsk\w*|sił\w*|policj\w*|policjant\w*)'
      - '^(?!.*\b(russia\w*|russian|rosj\w*|rosyjsk\w*|belarus\w*|białoru\w*)).*\bpolice forces\b'
      # Policja i antyterroryści wysłani na granicę (operacje porządkowe, nie wojsko przeciwnika).
      - '\b(police officers|policjanci|policjant\w*|counter-terrorism|antyterroryst\w*)\b.{0,60}\b(sent|deployed|wysłan\w*|skierowan\w*)'
      # Wojska sojusznicze przybywające DO państwa flanki (wzmocnienie NATO, ćwiczenia).
      - '\b(troops|forces|soldiers|żołnierz\w*|wojsk\w*)\b.{0,20}\b(deploy\w*|arriv\w*|przyb\w*|rozmieszcz\w*)\b.{0,10}\b(to|in|do|w|na)\s+(poland|polsce|polski|lithuania|litwie|litwy|latvia|łotwie|łotwy|estonia|estonii)\b'
  gotowosc:
    nazwa: "Gotowość bojowa i mobilizacja"
    waga: 3
    wysoka: true
    tylko_przeciwnik: true   # działania strony własnej nie liczą się (app/intencja.py, wersja 2.0)
    wzorce:
      - '\bmobili[sz]\w*'
      - '\breservists?\b'
      - '\bcall-?ups?\b'
      - '\bcombat readiness\b'
      - '\bsnap (drills?|exercises?|inspections?)'
      - '\bblood (supplies|supply|banks?|reserves)'
      - '\bfield hospitals?'
      - '\bmartial law'
      - '\bmobilizac\w*'
      - '\brezerwi\w*'
      - '\bgotowoś\w* bojow'
      - '\bszpital\w* polow'
      - '\bzapas\w* krwi'
      - '\bstan\w* wojenn'
