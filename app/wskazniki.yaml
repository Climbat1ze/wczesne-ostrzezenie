# Czy wiadomość dotyczy Polski i wschodniej flanki NATO. Mnożnik wagi wpisu w indeksie.
geografia:
  flanka:
    mnoznik: 1.0
    wzorce:
      - '\b(polsk|polsc|polan|poland|polish|warszaw|warsaw|rzesz[oó]w|lubli|białyst|bialyst|suwał|suwalk|przesmyk|litw|lithuan|vilni|wilni|wilno|łotw|latvi|ryg|riga|eston|tallin|bałty|balty|baltic|kaliningrad|królewiec|królewc|krolewiec|białoru|belarus|mińsk|minsk|gotland|finland|finlandi|finns?\b|eastern flank|wschodni\w* flank|narva|narwa)'
      - '(польш|литв|латви|эстони|прибалт|калининград|белорус|финлянд)'
      # Kraje nordyckie (decyzja właściciela 2026-11-03): tak samo narażone na działania Rosji jak Bałtyk.
      - '\b(szwec|szwedz|sweden|swedish|sverige|svensk|sztokholm|stockholm|norweg|norwes|norwa|norway|norge|norsk|oslo|dani[ię]\b|danii\b|duńs|dunsk|denmark|danish|danmark|kopenhag|copenhag|bornholm|øresund|islandi|iceland|reykjav|skandynaw|scandinav|nordyc|nordic)'
      - '(швец|шведск|норвеги|норвежск|дани[июя]|датск|исланди|скандинав)'
  nato:
    mnoznik: 0.6
    wzorce:
      - '\b(nato|sojusz\w* północnoatlantyck|alliance)\b'
      - '\bнато\b'
  reszta:
    mnoznik: 0.25

# Pierwsza połowa skali indeksu jest zawężona, bo w 2025-2026 tło (drony, sabotaż, wojna w Ukrainie) jest stale wysokie.
# Progi do kalibracji po 30 dniach historii.
progi:
  - {od: 0, nazwa: "Spokojnie", kolor: zielony, opis: "Tło informacyjne bez wyraźnych sygnałów wobec Polski i Bałtów.", luzno: "Pij kawę", luzno_opis: "Świat jak zwykle wariuje, ale nie celuje w nas."}
  - {od: 30, nazwa: "Podwyższona uwaga", kolor: zolty, opis: "Pojedyncze kategorie sygnałów aktywne. Warto czytać skrót codziennie.", luzno: "Sprawdź plecak", luzno_opis: "Latarka, powerbank, dokumenty w jednym miejscu. Bez paniki."}
  - {od: 50, nazwa: "Napięcie", kolor: pomaranczowy, opis: "Kilka kategorii naraz, z wielu niezależnych źródeł. Sprawdź plan rodzinny.", luzno: "Zatankuj do pełna", luzno_opis: "Pełny bak, gotówka w portfelu, plan rodzinny na stół."}
  - {od: 70, nazwa: "Alarm", kolor: czerwony, opis: "Spiętrzenie zbieżnych sygnałów jak przed 24.02.2022. Działaj według planu i komunikatów RCB.", luzno: "Do schronu", luzno_opis: "Słuchaj RCB, nie internetu. Działaj według planu."}

# Kamienie milowe sprzed inwazji na Ukrainę (X 2021 – II 2022). Aplikacja sprawdza, które z nich mają
# dziś odpowiednik wobec Polski lub Bałtów: kategoria + co najmniej 2 niezależne grupy źródeł w 30 dniach.
# odpowiednik: co dziś liczy się jako odpowiednik zdarzenia (kto działa, wobec kogo). Sprawdza to model (app/intencja.py,
#   weryfikuj_analogie); bez modelu liczą się same kategorie, a pulpit oznacza wynik jako niezweryfikowany.
analogia_2022:
  - {kategoria: wojska_granica, kiedy: "XI 2021", co: "Zdjęcia satelitarne i dokument wywiadu USA: ok. 175 tys. żołnierzy przy granicy Ukrainy (Washington Post, 3.12.2021).", odpowiednik: "Rosja lub Białoruś gromadzi albo przerzuca własne wojska, sprzęt lub rakiety w pobliże Polski, Bałtów lub krajów nordyckich."}
  - {kategoria: ostrzezenia_sojusznikow, kiedy: "XI–XII 2021", co: "USA i Wielka Brytania publicznie ostrzegają, że Rosja może zaatakować; odtajniają wywiad.", odpowiednik: "Rząd, wywiad albo dowództwo USA, Wielkiej Brytanii, NATO lub państwa regionu publicznie ostrzega, że Rosja lub Białoruś może zaatakować Polskę, Bałtów lub kraje nordyckie, albo ujawnia wywiad o takich planach. Rosyjskie oskarżenia, że to Polska lub NATO szykuje atak, NIE są odpowiednikiem (to pretekst)."}
  - {kategoria: retoryka, kiedy: "17.12.2021", co: "Rosja publikuje projekty traktatów z NATO i USA: żądanie gwarancji bezpieczeństwa i wycofania NATO.", odpowiednik: "Rosja stawia NATO, Polsce lub Bałtom formalne żądania albo ultimatum dotyczące bezpieczeństwa (wycofanie wojsk, gwarancje, strefy wpływów)."}
  - {kategoria: cyber, kiedy: "14.01.2022", co: "Atak na ukraińskie strony rządowe i złośliwe oprogramowanie WhisperGate.", odpowiednik: "Poważny cyberatak na instytucje państwowe lub infrastrukturę Polski, Bałtów albo krajów nordyckich, przypisywany Rosji lub Białorusi."}
  - {kategoria: pretekst, kiedy: "14.01.2022", co: "USA ostrzegają, że Rosja przygotowuje operację pod fałszywą flagą jako pretekst.", odpowiednik: "Zachodnie służby lub rządy ostrzegają, że Rosja szykuje prowokację pod fałszywą flagą wobec Polski, Bałtów lub krajów nordyckich, albo Rosja oskarża te państwa o przygotowanie ataku i buduje w ten sposób pretekst."}
  - {kategoria: gotowosc, kiedy: "I 2022", co: "Doniesienia o zapasach krwi i szpitalach polowych przy granicy.", odpowiednik: "Rosja lub Białoruś gromadzi zapasy krwi, rozwija szpitale polowe, mobilizuje rezerwistów albo podnosi gotowość bojową w pobliżu Polski, Bałtów lub krajów nordyckich."}
  - {kategoria: ewakuacja, kiedy: "23.01 i 11.02.2022", co: "USA ewakuują rodziny dyplomatów z Kijowa, potem wzywają obywateli do wyjazdu.", odpowiednik: "Państwa zachodnie ewakuują dyplomatów lub wzywają obywateli do opuszczenia Polski, Bałtów lub krajów nordyckich."}
  - {kategoria: cwiczenia, kiedy: "10–20.02.2022", co: "Ćwiczenia Union Resolve na Białorusi; wojska rosyjskie nie wracają po ich końcu.", odpowiednik: "Duże ćwiczenia wojsk Rosji lub Białorusi blisko Polski, Bałtów lub krajów nordyckich, zwłaszcza gdy wojska nie wracają po ich końcu. Ćwiczenia NATO, Polski albo państw europejskich NIE są odpowiednikiem."}
  - {kategoria: przestrzen_transport, kiedy: "II 2022", co: "Ubezpieczyciele i linie lotnicze wycofują się z ukraińskiego nieba; 24.02 zamknięcie przestrzeni.", odpowiednik: "Ubezpieczyciele lub linie lotnicze wycofują się z lotów nad Polską, Bałtami lub krajami nordyckimi z powodu zagrożenia wojskowego, albo przestrzeń zostaje zamknięta."}
  - {kategoria: hybryda, kiedy: "II 2022", co: "Incydenty i ostrzał w Donbasie przedstawiane przez Rosję jako ataki Ukrainy.", odpowiednik: "Incydenty, sabotaż, drony lub prowokacje na terytorium Polski, Bałtów lub krajów nordyckich, przypisywane Rosji lub Białorusi albo przedstawiane przez Rosję jako agresja tych państw."}

# Sygnały krytyczne: pojedyncze, bardzo konkretne zdarzenia, które same w sobie są powodem do alarmu.
# Mail idzie od razu (kontrola co godzinę), gdy sygnał wobec Polski lub Bałtów opiszą co najmniej
# 2 niezależne redakcje z oceną A lub B w ciągu 24 h. Ten sam sygnał nie wraca w mailu przez 72 h.
# W 2022 takim sygnałem było wezwanie USA do opuszczenia Ukrainy (11.02) i ewakuacja ambasady.
sygnaly_krytyczne:
  - nazwa: "Ewakuacja ambasady albo wezwanie do wyjazdu"
    wzorce:
      - '\b(ordered|authori[sz]ed) departure'
      - '\b(embass\w*)\b.{0,40}\b(evacuat\w*|ordered to leave|drawdown)'
      - '\b(leave|depart)\b.{0,30}\b(poland|lithuania|latvia|estonia)\b.{0,20}\bimmediately'
      - '\b(poland|lithuania|latvia|estonia)\b.{0,40}\b(level 4|do not travel)'
      - '\bewakuac\w* (ambasad|placówk|personelu dyplomat)'
      - '\bwezwa\w*\b.{0,40}\b(opuszczeni|wyjazd)\w*\b.{0,30}\b(polsk|litw|łotw|eston)'
  - nazwa: "Mobilizacja albo stan wojenny w Polsce lub krajach bałtyckich"
    wzorce:
      - '\b(declar\w*|announc\w*|order\w*)\b.{0,25}\b(general |full |partial )?mobili[sz]ation'
      - '\bmartial law\b.{0,30}\b(declared|imposed|introduced)'
      - '\b(ogłosz\w*|ogłasza\w*|zarządz\w*|wprowadz\w*)\b.{0,25}\b(mobilizacj\w*|stan\w* wojenn\w*)'
  - nazwa: "Konsultacje z art. 4 albo uruchomienie art. 5 NATO"
    wzorce:
      - '\b(invok\w*|request\w*|trigger\w*|call\w* for|hold\w*)\b.{0,30}\barticle (4|5|four|five)\b'
      - '\b(wnios\w*|uruchom\w*|zwoła\w*|powoła\w*)\b.{0,30}\b(art\.|artykuł\w*) ?(4|5)\b'
  - nazwa: "Zamknięcie przestrzeni powietrznej nad Polską lub krajem bałtyckim"
    wzorce:
      - '\b(clos\w*|shut\w*)\b.{0,15}\b(its |the )?(entire )?airspace\b'
      - '\b(zamkn\w*|zamyka\w*)\b.{0,15}\b(cał\w* )?przestrze\w* powietrzn'
  - nazwa: "Atak zbrojny na terytorium NATO"
    wzorce:
      - '\b(russia\w*|belarus\w*)\b.{0,40}\b(attack\w*|invad\w*|struck|strikes?)\b.{0,40}\b(poland|lithuania|latvia|estonia|nato territory)'
      - '\b(rosj\w*|białoru\w*)\b.{0,40}\b(zaatakował\w*|najechał\w*|uderzył\w*|ostrzelał\w*)\b.{0,40}\b(polsk\w*|litw\w*|łotw\w*|eston\w*|terytorium nato)'
