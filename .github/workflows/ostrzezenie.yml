# Workflow publicznego repo „wczesne-ostrzezenie”.
# Co godzinę: pobranie kanałów, tłumaczenie bałtyckich nagłówków (subskrypcja Claude), WW, alarmy mailem, strona na GitHub Pages.
# Raport tygodniowy mailem w poniedziałek o godzinie ze zmiennej STATUS_GODZINY (Warszawa, domyślnie 7).
# Sekrety: SMTP_USER, SMTP_PASS (hasło aplikacji Gmail), MAIL_DO (odbiorcy po przecinku), CLAUDE_CODE_OAUTH_TOKEN.
# Opcjonalnie: sekret MAIL_ADMIN; zmienne STATUS_GODZINY, STATUS_DNI, STATUS_FORMA, SITE_URL,
# CLAUDE_BUDZET_DZIENNY (domyślnie 150), CLAUDE_WYLACZ (1 = bez Claude), ALARMY_DZIENNIE (domyślnie 3).
# Settings → Pages → Source: GitHub Actions.
name: wczesne-ostrzezenie

# Sztafeta (od 2.0.3): każdy przebieg na końcu czeka ok. godziny i sam zleca następny (workflow_dispatch),
# bo GitHub gubi większość uruchomień z crona (4–5.11: 3 z ok. 45). Czeka tylko jeden job sztafety naraz
# (nowszy anuluje starszy), więc łańcuchy się nie mnożą. Wyłącznik: zmienna repo SZTAFETA_WYLACZ=1.
# Cron zostaje jako zapas: dwa wpisy co 30 minut; job „sprawdz” pomija przebieg z crona przy danych młodszych niż 40 minut.
# Czuwanie (czuwanie.yml) ratuje, gdy przerwie się i sztafeta, i cron.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mail_skrot:
        description: 'Wyślij raport mailem teraz'
        type: boolean
        default: false
      tryb:
        description: 'reczny = z przeglądem źródeł; harmonogram = jak przebieg z crona (używa czuwanie.yml)'
        type: choice
        options: [reczny, harmonogram]
        default: reczny

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read      # oceny właściciela (etykiety ocena-trafny, ocena-pomylka)

# Kolejka na poziomie joba „run” (nie całego workflow), żeby czekająca sztafeta nie blokowała przebiegów.
jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      uruchom: ${{ steps.wiek.outputs.uruchom }}
    steps:
      - id: wiek
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "uruchom=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          OST=$(gh api "repos/$GITHUB_REPOSITORY/commits/dane" --jq '.commit.committer.date' 2>/dev/null || echo "")
          if [ -z "$OST" ]; then echo "uruchom=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          MIN=$(( ( $(date -u +%s) - $(date -u -d "$OST" +%s) ) / 60 ))
          echo "Ostatni zapis danych: $OST ($MIN min temu)"
          if [ "$MIN" -lt 40 ]; then echo "Pomijam: świeże dane"; echo "uruchom=false" >> "$GITHUB_OUTPUT"; else echo "uruchom=true" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: sprawdz
    if: needs.sprawdz.outputs.uruchom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wczesne-ostrzezenie
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - run: pip install -r app/requirements.txt

      - name: Claude Code CLI (tłumaczenie na subskrypcji)
        run: npm install -g @anthropic-ai/claude-code@2.1.316 >/dev/null 2>&1 && claude --version || echo "CLI niedostępne, nagłówki zostaną w oryginale"

      - name: Wczytaj dane z gałęzi dane
        run: |
          if git ls-remote --exit-code --heads origin dane >/dev/null; then
            git fetch -q --depth=1 origin dane
            git checkout FETCH_HEAD -- app/dane
          else
            echo "Pierwsze uruchomienie: dane startowe z main"
          fi
          # historia zgłoszeń (tylko odczyt: zakładki ZGŁOSZENIA i JAKOŚĆ, raport administracyjny); zapisuje ją zgloszenia.yml
          rm -rf app/dane/zgloszenia
          if git ls-remote --exit-code --heads origin zgloszenia >/dev/null; then
            git fetch -q --depth=1 origin zgloszenia && git checkout FETCH_HEAD -- app/dane/zgloszenia && git reset -q
          fi

      - name: Pobierz, przetłumacz, analizuj, powiadom
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_DO: ${{ secrets.MAIL_DO }}
          MAIL_ADMIN: ${{ secrets.MAIL_ADMIN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STATUS_GODZINY: ${{ vars.STATUS_GODZINY || '7' }}
          STATUS_DNI: ${{ vars.STATUS_DNI || '1' }}
          STATUS_FORMA: ${{ vars.STATUS_FORMA || 'tydzien' }}
          SITE_URL: ${{ vars.SITE_URL }}
          CLAUDE_BUDZET_DZIENNY: ${{ vars.CLAUDE_BUDZET_DZIENNY }}
          CLAUDE_WYLACZ: ${{ vars.CLAUDE_WYLACZ }}
          ALARMY_DZIENNIE: ${{ vars.ALARMY_DZIENNIE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tryb }}" != "harmonogram" ]; then
            EXTRA="--utrzymanie-zrodel"
            if [ "${{ inputs.mail_skrot }}" = "true" ]; then EXTRA="$EXTRA --mail-skrot"; fi
          fi
          python app/ostrzezenie.py uruchom --harmonogram $EXTRA --status-md "$RUNNER_TEMP/status_auto.md" --znacznik-main "$RUNNER_TEMP/do_main"
          cp app/zrodla.yaml "$RUNNER_TEMP/zrodla.yaml"
          mkdir -p "$RUNNER_TEMP/tests_dane" && cp tests/dane/*.jsonl "$RUNNER_TEMP/tests_dane/" 2>/dev/null || true
          cp -r strona "$RUNNER_TEMP/strona"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: strona
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Zapisz dane na gałąź dane (jeden commit, bez narastającej historii)
        run: |
          TMP=$(mktemp -d)
          cp -r app/dane "$TMP/dane" && rm -rf "$TMP/dane/zgloszenia"
          git config user.name "ostrzezenie[bot]"
          git config user.email "ostrzezenie-bot@users.noreply.github.com"
          git branch -D dane-tmp >/dev/null 2>&1 || true
          git checkout -q --orphan dane-tmp
          git rm -rqf . >/dev/null
          git clean -fdq
          mkdir -p app && cp -r "$TMP/dane" app/dane
          git add -A app
          git commit -qm "dane $(date -u +%Y-%m-%dT%H:%M)"
          git push -q -f origin HEAD:dane

      - name: Rejestr źródeł i oceny właściciela do main (poniedziałek)
        run: |
          [ -f "$RUNNER_TEMP/do_main" ] || { echo "Bez przeglądu źródeł w tym przebiegu"; exit 0; }
          git fetch -q origin main
          git checkout -q -f -B main origin/main
          git clean -fdq
          cp "$RUNNER_TEMP/zrodla.yaml" app/zrodla.yaml
          mkdir -p tests/dane && cp "$RUNNER_TEMP"/tests_dane/*.jsonl tests/dane/ 2>/dev/null || true
          git add app/zrodla.yaml tests/dane
          git diff --staged --quiet && exit 0
          git commit -qm "[dane] $(date -u +%Y-%m-%d) rejestr zrodel i oceny wlasciciela"
          for i in 1 2 3; do git push -q origin main && break; GIT_EDITOR=true git pull -q --rebase origin main; done

  # Sztafeta: zleca następny przebieg, gdy minie 45 min od startu tego joba i 58 min od ostatniego zapisu danych.
  # Przebieg nieudany też przekazuje pałeczkę (ponowna próba za godzinę). Repo publiczne: minuty runnera bez opłat.
  sztafeta:
    needs: [sprawdz, run]
    if: ${{ !cancelled() && vars.SZTAFETA_WYLACZ != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    concurrency:
      group: sztafeta
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      TEN_PRZEBIEG: ${{ github.run_id }}
    steps:
      - name: Czekaj i zleć następny przebieg
        run: |
          START=$(date -u +%s)
          while true; do
            OST=$(gh api "repos/$R/commits/dane" --jq '.commit.committer.date' 2>/dev/null || echo "")
            TERAZ=$(date -u +%s)
            CEL=$(( START + 45*60 ))
            if [ -n "$OST" ]; then
              ZAPIS=$(date -u -d "$OST" +%s)
              [ $(( ZAPIS + 58*60 )) -gt "$CEL" ] && CEL=$(( ZAPIS + 58*60 ))
            fi
            [ "$TERAZ" -ge "$CEL" ] && break
            CZEKAJ=$(( CEL - TERAZ )); [ "$CZEKAJ" -gt 300 ] && CZEKAJ=300
            echo "Ostatni zapis danych: ${OST:-brak}; następny przebieg za $(( (CEL - TERAZ) / 60 )) min"
            sleep "$CZEKAJ"
          done
          INNE=$(gh run list -R "$R" --workflow ostrzezenie.yml --json databaseId,status \
                 --jq "[.[] | select(.status != \"completed\" and .databaseId != $TEN_PRZEBIEG)] | length")
          if [ "$INNE" != "0" ]; then echo "Inny przebieg już trwa lub czeka ($INNE): on przejmie sztafetę"; exit 0; fi
          gh workflow run ostrzezenie.yml -R "$R" -f tryb=harmonogram
          echo "Zlecono następny przebieg"
